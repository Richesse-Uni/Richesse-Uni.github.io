lang: fr
title: Richesse OTSIE
description: "Richesse Otsie — Étudiant en Bachelor systèmes numériques et technologies innovantes, à la recherche d'une alternance en amélioration continue, Lean Manufacturing et Supply Chain."
theme: bulma-clean-theme

url: https://richesse-uni.github.io

force_theme: light
permalink: pretty
lang: fr
theme_color: '#ef2e31'
fixed_navbar: top

collections:
  products: 
    output: true
    layout: product
    image: https://via.placeholder.com/800x600
    show_sidebar: false

plugins:
  - jekyll-remote-include
  
exclude:
  - node_modules/
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .devcontainer/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json

sass:
  style: compressed
