lang: fr
title: Richesse OTSIE
description: "Richesse Otsie — Étudiant en Bachelor systèmes numériques et technologies innovantes, à la recherche d'une alternance en amélioration continue, Lean Manufacturing et Supply Chain."
theme: bulma-clean-theme

url: https://richesse-uni.github.io

force_theme: light
permalink: pretty
lang: fr
theme_color: '#ef2e31'
fixed_navbar: top

collections:
  products:
    output: true
    layout: product
    show_sidebar: false

# Image par défaut pour tout document de la collection "products" qui n'a pas son propre champ
# `image:` en front matter (ex. pas encore de vraie capture d'écran disponible).
defaults:
  - scope:
      path: ""
      type: products
    values:
      image: /assets/imgs/projet-placeholder.svg

plugins:
  - jekyll-remote-include
  
exclude:
  - node_modules/
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - .devcontainer/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json

sass:
  style: compressed
